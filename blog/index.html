<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Chilly Hill blog: notes on inner landscapes, psychedelics, and systems of the mind."
    />
    <meta name="theme-color" content="#f7fbff" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Blog — Chilly Hill" />
    <meta
      property="og:description"
      content="Chilly Hill blog: notes on inner landscapes, psychedelics, and systems of the mind."
    />
    <meta property="og:url" content="https://chillyhill.ch/blog/" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Blog — Chilly Hill" />
    <meta
      name="twitter:description"
      content="Chilly Hill blog: notes on inner landscapes, psychedelics, and systems of the mind."
    />

    <title>Blog — Chilly Hill</title>
    <link rel="canonical" href="https://chillyhill.ch/blog/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Space+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="../assets/svg/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/blog.css" />
  </head>
  <body class="blog-page">
    <svg
      id="orbit-background"
      class="orbit-background"
      viewBox="0 0 1200 1200"
      aria-hidden="true"
      focusable="false"
    ></svg>

    <header class="site-header max-w-container">
      <a class="home-link" href="../" aria-label="Chilly Hill home">
        <img src="../assets/svg/favicon.svg" alt="" width="24" height="24" />
        <span>Chilly Hill</span>
      </a>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="./" aria-current="page">Blog</a>
        <a href="../about/">About</a>
      </nav>
    </header>

    <main class="site-main">
      <article
        class="blog-article max-w-container"
        aria-labelledby="blog-title"
      >
        <header class="blog-intro">
          <h1 id="blog-title">Blog</h1>
        </header>

        <div id="blog-posts" class="blog-posts-grid" aria-live="polite"></div>
      </article>
    </main>

    <footer class="site-footer">
      <small>&copy; <span id="current-year"></span> Chilly Hill</small>
    </footer>

    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/blog.js"></script>
  </body>
</html>
